tag = "ubuntu-work"
image = "ubuntu:latest"
home = "ubuntu-work"

[ARG]
USER = "sonia"
USER_UID = 1000
USER_GID = 1000
DEBIAN_FRONTEND = "noninteractive"
PASSWD = " "

[script.pkg_install]
pkgs = [
  "git",
  "curl",
  "wget",
  "x11-apps",
  "mesa-utils",
  "zsh",
  "sudo",
  "pulseaudio",
  "pulseaudio-utils",
  "libpulse0",
  "libgtk-3-0",
  "libgtk-4-1",
  "gtk2-engines-murrine",
  "xdg-desktop-portal-gtk",
  "adwaita-icon-theme",
  "fonts-dejavu-core",
  "dbus",
  "libcanberra-gtk3-module",
  "at-spi2-core",
]
dev_pkgs = ["build-essential", "python3", "python3-pip", "golang-go"]

[RUN]
cmd = ["go install github.com/jesseduffield/lazygit@latest"]

[podman_args]
# volume = ["/home/sonia/.osboxes/work-home:/home/sonia:Z"]
